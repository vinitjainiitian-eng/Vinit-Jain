<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JEE Nexus AI • CBT Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>

<style>
:root{
--bg:#070b14;
--panel:#0d1422;
--line:#22304a;
--text:#edf3ff;
--muted:#8fa0ba;
--blue:#4f7cff;
--green:#25d695;
--red:#ff6377;
--gold:#ffc857
}

*{box-sizing:border-box}

html,body{
margin:0;
background:radial-gradient(circle at 20% 0%,#14264b 0,#070b14 35%);
color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif
}

body{min-height:100vh}

.app{
max-width:1100px;
margin:auto;
padding:18px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
padding:18px 20px;
border:1px solid var(--line);
background:#0b1220d9;
backdrop-filter:blur(18px);
border-radius:22px;
position:sticky;
top:10px;
z-index:20
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:44px;
height:44px;
border-radius:14px;
background:linear-gradient(135deg,#4f7cff,#7c4dff);
display:grid;
place-items:center;
font-weight:900
}

.brand h1{
font-size:18px;
margin:0
}

.brand p{
font-size:12px;
color:var(--muted);
margin:3px 0 0
}

.user-pill{
padding:10px 13px;
border:1px solid var(--line);
border-radius:12px;
color:var(--muted);
font-size:12px
}

.hero{
padding:48px 10px 28px
}

.hero h2{
font-size:clamp(32px,6vw,62px);
line-height:.98;
margin:0;
letter-spacing:-2px
}

.hero h2 span{
color:#7194ff
}

.hero p{
color:var(--muted);
max-width:720px;
font-size:16px;
line-height:1.6
}

.grid{
display:grid;
grid-template-columns:1.3fr .7fr;
gap:18px
}

.panel{
background:linear-gradient(180deg,#0e1728,#0b1220);
border:1px solid var(--line);
border-radius:22px;
padding:20px;
box-shadow:0 18px 50px #0005
}

.panel h3{
margin:0 0 5px;
font-size:19px
}

.sub{
font-size:13px;
color:var(--muted);
line-height:1.5;
margin:0 0 16px
}

input,select{
width:100%;
padding:13px 14px;
border-radius:12px;
border:1px solid var(--line);
background:#080e19;
color:var(--text);
outline:0
}

input:focus,select:focus{
border-color:#5c82ff;
box-shadow:0 0 0 3px #4f7cff22
}

.btn{
border:0;
border-radius:13px;
padding:13px 16px;
font-weight:800;
color:#fff;
background:#1a2740;
cursor:pointer
}

.btn.primary{
background:linear-gradient(135deg,#4f7cff,#684cff)
}

.btn.green{
background:linear-gradient(135deg,#17b979,#1d9d72)
}

.btn:disabled{
opacity:.45;
cursor:not-allowed
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap
}

.row>*{
flex:1
}

.auth{
display:grid;
gap:10px
}

.auth-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.tiny{
font-size:11px;
color:var(--muted);
line-height:1.5
}

.status{
font-size:12px;
margin-top:8px
}

.ok{color:var(--green)}
.bad{color:var(--red)}
.warn{color:var(--gold)}

.provider{
border:1px solid var(--line);
border-radius:15px;
padding:14px;
margin-top:10px;
background:#
