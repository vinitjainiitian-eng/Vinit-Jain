<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JEE Main CBT Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' }, startup: { typeset: false } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drawer-open { transform: translateX(0%); }
        .drawer-closed { transform: translateX(100%); }
        @media (min-width: 768px) { .drawer-closed { transform: translateX(0%); } }
    </style>
</head>
<body class="bg-[#f5f6f8] text-gray-800 overflow-hidden select-none">

    <div id="app" class="w-full h-screen flex flex-col relative">
        <div id="screen-start" class="absolute inset-0 bg-gray-100 flex flex-col items-center justify-center p-4 z-50">
            <button onclick="startTest()" class="bg-blue-600 text-white font-black py-4 px-8 rounded-lg shadow-lg text-lg uppercase">Start Assessment</button>
        </div>
        <div id="screen-test" class="absolute inset-0 flex flex-col hidden z-40">
            <header class="bg-white shadow-sm px-3 py-3 flex justify-between items-center border-b">
                <div class="font-extrabold text-xl text-blue-900">JEE MOCK</div>
            </header>
            <div id="subject-tabs" class="flex overflow-x-auto bg-white border-b shrink-0 hide-scrollbar"></div>
            <div id="question-container" class="flex-1 overflow-y-auto p-4 md:p-8">
                <div id="q-text" class="text-base md:text-lg text-gray-800 mb-6 font-medium"></div>
                <div id="q-options" class="space-y-3"></div>
            </div>
            <div class="p-4 bg-white border-t flex gap-2">
                <button onclick="handleSave()" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-lg">Save & Next</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://vinit-jain-2.onrender.com';
        
        const QUESTION_DATA = [
            { id: 1, subject: 'Physics', type: 'MCQ', text: 'Physics Question 1...', options: ['A', 'B', 'C', 'D'], answer: '4' },
            { id: 2, subject: 'Chemistry', type: 'MCQ', text: 'Chemistry Question 1...', options: ['A', 'B', 'C', 'D'], answer: '2' },
            { id: 3, subject: 'Mathematics', type: 'NAT', text: 'Math Question 1...', answer: '384' }
        ];

        let currSubject = 'Physics', currIndex = 0;
        
        function startTest() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-test').classList.remove('hidden');
            renderQuestion();
        }

        function getCurrQ() { return QUESTION_DATA.filter(q => q.subject === currSubject)[currIndex]; }

        function renderQuestion() {
            const q = getCurrQ();
            document.getElementById('q-text').innerText = q.text;
            // ... rest of logic
        }

        function handleSave() {
            if(currIndex < 2) { currIndex++; renderQuestion(); }
        }
    </script>
</body>
</html>
